name: Dependency Review

# 在 PR 中审查新增/升级的依赖，拦截高危漏洞、许可证风险和恶意包。
# 注意：该 action 依赖 GitHub Dependency Graph / GHAS：
#   - 公共仓库可直接使用
#   - 私有仓库需要启用 GitHub Advanced Security

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
