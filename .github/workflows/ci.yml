name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci || npm install

      - name: 类型检查 + ESLint
        run: npx --no-install next lint || npm run lint

      - name: 单元测试
        run: npm run test:run

      - name: 构建
        env:
          BACKEND_URL: http://localhost:8080
          NEXT_PUBLIC_API_BASE: /api/v1
        run: npm run build

  backend:
    name: Backend (build + vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: 编译所有二进制
        run: |
          CGO_ENABLED=0 go build -o /tmp/server ./cmd/server/
          CGO_ENABLED=0 go build -o /tmp/migrate ./cmd/migrate/
          CGO_ENABLED=0 go build -o /tmp/seed ./cmd/seed/
          CGO_ENABLED=0 go build -o /tmp/reindex ./cmd/reindex/

  docker:
    name: Docker buildx check
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 预拉基础镜像（缓存）
        run: |
          docker pull node:22-alpine
          docker pull golang:1.25-alpine