<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布文章 - Dim Stack 管理后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS Reset & Base ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      /* Light Mode Colors (OKLCH) */
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.145 0 0);
      --muted: oklch(0.97 0 0);
      --muted-foreground: oklch(0.556 0 0);
      --border: oklch(0.922 0 0);
      --input: oklch(0.97 0 0);
      --ring: oklch(0.708 0 0);
      --destructive: oklch(0.577 0.245 27.325);
      --success: oklch(0.72 0.19 145);
      
      /* Brand Colors */
      --brand-50: oklch(0.97 0.014 250);
      --brand-100: oklch(0.93 0.030 250);
      --brand-200: oklch(0.87 0.060 250);
      --brand-300: oklch(0.78 0.115 250);
      --brand-400: oklch(0.70 0.160 250);
      --brand-500: oklch(0.62 0.195 255);
      --brand-600: oklch(0.55 0.220 258);
      --brand-700: oklch(0.48 0.225 262);
      
      /* Radius */
      --radius: 0.625rem;
      
      /* Shadows */
      --shadow-card: 0 1px 3px 0 rgb(0 0 0 / .06), 0 1px 2px -1px rgb(0 0 0 / .04);
      --shadow-card-hover: 0 10px 25px -3px rgb(0 0 0 / .08), 0 4px 10px -4px rgb(0 0 0 / .04);
      --shadow-brand-glow: 0 0 0 3px rgb(59 130 246 / .18);
    }
    
    html { font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { 
      background: var(--muted); color: var(--foreground);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    
    /* ===== Top Header ===== */
    .top-header {
      height: 56px; background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      position: sticky; top: 0; z-index: 10;
    }
    
    .header-left { display: flex; align-items: center; gap: 12px; }
    
    .back-btn {
      width: 36px; height: 36px; border: none; background: transparent;
      border-radius: calc(var(--radius) * 0.8); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted-foreground);
      transition: all 0.15s;
    }
    .back-btn:hover { background: var(--muted); color: var(--foreground); }
    
    .page-title { font-size: 1.0625rem; font-weight: 600; }
    
    .header-right { display: flex; align-items: center; gap: 8px; }
    
    /* ===== Buttons ===== */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; font-size: 0.8125rem; font-weight: 500;
      border-radius: calc(var(--radius)); cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    
    .btn-outline {
      background: transparent; color: var(--foreground);
      border-color: var(--border);
    }
    .btn-outline:hover { background: var(--muted); }
    
    .btn-primary {
      background: var(--brand-500); color: white;
      box-shadow: 0 1px 2px rgb(59 130 246 / 0.3);
    }
    .btn-primary:hover { background: var(--brand-600); }
    
    .btn-sm { padding: 6px 10px; font-size: 0.75rem; }
    
    /* ===== Main Container ===== */
    .container {
      max-width: 900px; margin: 0 auto;
      padding: 24px 16px;
    }
    
    /* ===== Editor Card ===== */
    .editor-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 1.6);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    
    /* ===== Form Sections ===== */
    .form-section { padding: 20px; border-bottom: 1px solid var(--border); }
    .form-section:last-child { border-bottom: none; }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group:last-child { margin-bottom: 0; }
    
    .form-label {
      font-size: 0.8125rem; font-weight: 500; color: var(--foreground);
    }
    .form-label.required::after {
      content: ' *'; color: var(--destructive);
    }
    
    .form-input {
      width: 100%; height: 40px; padding: 0 12px;
      font-size: 0.9375rem; color: var(--foreground);
      background: var(--input); border: 1px solid var(--border);
      border-radius: calc(var(--radius));
      transition: all 0.2s;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--brand-400);
      box-shadow: var(--shadow-brand-glow);
    }
    .form-input.title-input { font-size: 1.0625rem; font-weight: 500; }
    
    .form-select {
      width: 100%; height: 40px; padding: 0 12px;
      font-size: 0.875rem; color: var(--foreground);
      background: var(--input); border: 1px solid var(--border);
      border-radius: calc(var(--radius));
      transition: all 0.2s;
      outline: none;
      cursor: pointer;
    }
    .form-select:focus {
      border-color: var(--brand-400);
      box-shadow: var(--shadow-brand-glow);
    }
    
    .form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
    
    /* ===== Tags Input ===== */
    .tags-input-wrap {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 8px 12px;
      background: var(--input); border: 1px solid var(--border);
      border-radius: calc(var(--radius));
      min-height: 40px;
      cursor: text;
      transition: all 0.2s;
    }
    .tags-input-wrap:focus-within {
      border-color: var(--brand-400);
      box-shadow: var(--shadow-brand-glow);
    }
    
    .tag-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; font-size: 0.75rem;
      background: var(--brand-100); color: var(--brand-700);
      border-radius: calc(var(--radius) * 0.6);
    }
    
    .tag-remove {
      width: 14px; height: 14px; border: none; background: transparent;
      cursor: pointer; color: var(--brand-600);
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
    }
    .tag-remove:hover { background: var(--brand-200); }
    
    .tags-input {
      flex: 1; min-width: 80px; border: none; outline: none;
      font-size: 0.875rem; background: transparent;
      padding: 2px 0;
    }
    
    /* ===== Cover Upload ===== */
    .cover-upload {
      border: 2px dashed var(--border);
      border-radius: calc(var(--radius) * 1.2);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--muted);
    }
    .cover-upload:hover { border-color: var(--brand-400); background: var(--brand-50); }
    
    .cover-upload-icon {
      width: 48px; height: 48px; margin: 0 auto 12px;
      background: var(--brand-100); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--brand-600);
    }
    
    .cover-upload-text { font-size: 0.875rem; color: var(--muted-foreground); }
    .cover-upload-text strong { color: var(--brand-600); }
    
    .cover-preview {
      position: relative; border-radius: calc(var(--radius));
      overflow: hidden;
    }
    .cover-preview img {
      width: 100%; height: 160px; object-fit: cover;
    }
    .cover-preview-overlay {
      position: absolute; inset: 0;
      background: rgb(0 0 0 / 0.5);
      display: flex; align-items: center; justify-content: center;
      gap: 8px; opacity: 0;
      transition: opacity 0.2s;
    }
    .cover-preview:hover .cover-preview-overlay { opacity: 1; }
    
    .cover-action-btn {
      width: 36px; height: 36px; border: none; background: white;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--foreground);
      transition: all 0.15s;
    }
    .cover-action-btn:hover { background: var(--muted); }
    
    /* ===== Toolbar ===== */
    .toolbar {
      display: flex; align-items: center; gap: 2px;
      padding: 8px 12px;
      background: var(--muted);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    
    .toolbar-btn {
      width: 32px; height: 32px; border: none; background: transparent;
      border-radius: calc(var(--radius) * 0.6); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted-foreground);
      transition: all 0.15s;
    }
    .toolbar-btn:hover { background: var(--card); color: var(--foreground); }
    .toolbar-btn.active { background: var(--brand-100); color: var(--brand-700); }
    
    .toolbar-divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    
    .toolbar-label {
      font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--muted-foreground);
      padding: 0 8px;
    }
    
    /* ===== Markdown Editor ===== */
    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 400px;
    }
    @media (max-width: 768px) { .editor-container { grid-template-columns: 1fr; } }
    
    .editor-pane {
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .editor-pane:last-child { border-right: none; }
    
    .pane-header {
      padding: 8px 12px; font-size: 0.6875rem; font-weight: 500;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--muted-foreground);
      background: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    
    .markdown-input {
      flex: 1; padding: 16px;
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 0.875rem; line-height: 1.6;
      color: var(--foreground);
      background: var(--card);
      border: none; outline: none;
      resize: none;
    }
    
    .markdown-preview {
      flex: 1; padding: 16px;
      background: var(--card);
      overflow-y: auto;
    }
    
    /* Preview Styles */
    .preview-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
    .preview-meta { font-size: 0.875rem; color: var(--muted-foreground); margin-bottom: 16px; }
    .preview-content { font-size: 0.9375rem; line-height: 1.7; }
    .preview-content h2 { font-size: 1.25rem; font-weight: 600; margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .preview-content h3 { font-size: 1.125rem; font-weight: 600; margin: 20px 0 10px; }
    .preview-content p { margin-bottom: 12px; }
    .preview-content code { padding: 2px 6px; background: var(--muted); border-radius: 4px; font-size: 0.875em; }
    .preview-content pre { padding: 16px; background: var(--muted); border-radius: calc(var(--radius)); overflow-x: auto; margin: 16px 0; }
    .preview-content pre code { padding: 0; background: none; }
    .preview-content blockquote { padding: 12px 16px; border-left: 3px solid var(--brand-500); background: var(--brand-50); margin: 16px 0; }
    .preview-content ul, .preview-content ol { padding-left: 24px; margin-bottom: 12px; }
    .preview-content li { margin-bottom: 4px; }
    
    /* ===== Draft Banner ===== */
    .draft-banner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: oklch(0.95 0.12 85);
      border: 1px solid oklch(0.9 0.12 85);
      border-radius: calc(var(--radius));
      margin-bottom: 16px;
    }
    
    .draft-info { display: flex; align-items: center; gap: 10px; }
    .draft-icon {
      width: 32px; height: 32px; border-radius: 50%;
      background: oklch(0.85 0.14 85);
      display: flex; align-items: center; justify-content: center;
      color: oklch(0.55 0.14 85);
    }
    .draft-text { font-size: 0.875rem; }
    .draft-title { font-weight: 500; }
    .draft-time { font-size: 0.75rem; color: var(--muted-foreground); }
    
    .draft-actions { display: flex; gap: 8px; }
    
    /* ===== Sync Toggle ===== */
    .sync-toggle {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 0.75rem; color: var(--muted-foreground);
    }
    
    .toggle-switch {
      position: relative; width: 36px; height: 20px;
      background: var(--border); border-radius: 10px;
      cursor: pointer; transition: all 0.2s;
    }
    .toggle-switch::after {
      content: ''; position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px; border-radius: 50%;
      background: white; box-shadow: 0 1px 3px rgb(0 0 0 / 0.2);
      transition: all 0.2s;
    }
    .toggle-switch.active { background: var(--brand-500); }
    .toggle-switch.active::after { left: 18px; }
  </style>
</head>
<body>
  <!-- Top Header -->
  <header class="top-header">
    <div class="header-left">
      <button class="back-btn" aria-label="返回">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <span class="page-title">发布文章</span>
    </div>
    <div class="header-right">
      <button class="btn btn-outline btn-sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        保存草稿
      </button>
      <button class="btn btn-primary btn-sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7z"/>
        </svg>
        发布文章
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Draft Banner (if exists) -->
    <div class="draft-banner">
      <div class="draft-info">
        <div class="draft-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div class="draft-text">
          <div class="draft-title">检测到未保存的草稿</div>
          <div class="draft-time">最后编辑于 10 分钟前</div>
        </div>
      </div>
      <div class="draft-actions">
        <button class="btn btn-outline btn-sm">丢弃</button>
        <button class="btn btn-primary btn-sm">恢复草稿</button>
      </div>
    </div>

    <!-- Editor Card -->
    <div class="editor-card">
      <!-- Title -->
      <div class="form-section">
        <div class="form-group">
          <label class="form-label required" for="article-title">文章标题</label>
          <input class="form-input title-input" type="text" id="article-title" name="title" placeholder="输入文章标题...">
        </div>
      </div>

      <!-- Meta Info -->
      <div class="form-section">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="category">分类</label>
            <select class="form-select" id="category" name="category">
              <option value="">请选择分类</option>
              <option value="tech">技术分享</option>
              <option value="tools">开发工具</option>
              <option value="exp">经验总结</option>
              <option value="perf">性能优化</option>
              <option value="frame">框架探索</option>
              <option value="life">生活随笔</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="type">类型</label>
            <select class="form-select" id="type" name="type">
              <option value="original">原创</option>
              <option value="reprint">转载</option>
              <option value="translation">翻译</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="status">状态</label>
            <select class="form-select" id="status" name="status">
              <option value="public">公开</option>
              <option value="private">私密</option>
              <option value="draft">草稿</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Tags -->
      <div class="form-section">
        <div class="form-group">
          <label class="form-label">标签</label>
          <div class="tags-input-wrap">
            <span class="tag-chip">
              Next.js
              <button class="tag-remove" aria-label="移除">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                </svg>
              </button>
            </span>
            <span class="tag-chip">
              React
              <button class="tag-remove" aria-label="移除">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                </svg>
              </button>
            </span>
            <input class="tags-input" type="text" placeholder="添加标签...">
          </div>
        </div>
      </div>

      <!-- Cover Image -->
      <div class="form-section">
        <div class="form-group">
          <label class="form-label">封面图片</label>
          <div class="cover-preview">
            <img src="https://picsum.photos/800/320?random=1" alt="封面预览">
            <div class="cover-preview-overlay">
              <button class="cover-action-btn" aria-label="删除">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                </svg>
              </button>
              <button class="cover-action-btn" aria-label="替换">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/>
                  <line x1="16" x2="22" y1="5" y2="5"/><line x1="19" x2="19" y1="2" y2="8"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Editor -->
      <div class="form-section" style="padding: 0;">
        <!-- Toolbar -->
        <div class="toolbar">
          <span class="toolbar-label">格式</span>
          <button class="toolbar-btn" title="加粗">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/>
            </svg>
          </button>
          <button class="toolbar-btn" title="斜体">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" x2="10" y1="4" y2="4"/><line x1="14" x2="5" y1="20" y2="20"/><line x1="15" x2="9" y1="4" y2="20"/>
            </svg>
          </button>
          <button class="toolbar-btn" title="删除线">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/>
              <line x1="4" x2="20" y1="12" y2="12"/>
            </svg>
          </button>
          
          <div class="toolbar-divider"></div>
          
          <span class="toolbar-label">标题</span>
          <button class="toolbar-btn" title="标题2">
            <span style="font-weight: 700; font-size: 12px;">H2</span>
          </button>
          <button class="toolbar-btn" title="标题3">
            <span style="font-weight: 700; font-size: 11px;">H3</span>
          </button>
          
          <div class="toolbar-divider"></div>
          
          <button class="toolbar-btn" title="引用">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V21z"/>
              <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/>
            </svg>
          </button>
          <button class="toolbar-btn" title="代码">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
            </svg>
