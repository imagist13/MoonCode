<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - Dim Stack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS Reset & Base ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      /* Brand Colors (OKLCH) */
      --brand-50: oklch(0.97 0.014 250);
      --brand-100: oklch(0.93 0.030 250);
      --brand-200: oklch(0.87 0.060 250);
      --brand-300: oklch(0.78 0.115 250);
      --brand-400: oklch(0.70 0.160 250);
      --brand-500: oklch(0.62 0.195 255);
      --brand-600: oklch(0.55 0.220 258);
      --brand-700: oklch(0.48 0.225 262);
      
      /* Neutrals */
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
      --muted: oklch(0.97 0 0);
      --muted-foreground: oklch(0.556 0 0);
      --border: oklch(0.922 0 0);
      --input: oklch(0.922 0 0);
      --ring: oklch(0.708 0 0);
      --destructive: oklch(0.577 0.245 27.325);
      
      /* Radius */
      --radius: 0.625rem;
      
      /* Shadows */
      --shadow-card: 0 1px 3px 0 rgb(0 0 0 / .06), 0 1px 2px -1px rgb(0 0 0 / .04);
      --shadow-card-hover: 0 10px 25px -3px rgb(0 0 0 / .08), 0 4px 10px -4px rgb(0 0 0 / .04);
      --shadow-brand-glow: 0 0 0 3px rgb(59 130 246 / .18);
    }
    
    html { font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { 
      min-height: 100vh; 
      background: linear-gradient(135deg, var(--brand-50) 0%, var(--background) 50%, oklch(0.97 0.015 290 / 0.4) 100%);
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 16px;
    }
    
    /* ===== Decorative Orbs ===== */
    .orb {
      position: fixed; border-radius: 50%; pointer-events: none;
      filter: blur(80px);
    }
    .orb-1 { top: -120px; right: -120px; width: 380px; height: 380px; background: var(--brand-400 / 0.25); }
    .orb-2 { bottom: -120px; left: -120px; width: 440px; height: 440px; background: oklch(0.78 0.16 290 / 0.2); }
    .orb-3 { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 256px; height: 256px; background: var(--brand-500 / 0.08); animation: pulse-orb 4s ease-in-out infinite; }
    
    @keyframes pulse-orb {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }
    
    /* ===== Register Card ===== */
    .register-card {
      position: relative; z-index: 10;
      width: 100%; max-width: 420px;
      background: rgb(255 255 255 / 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 1.6);
      box-shadow: var(--shadow-card-hover);
      padding: 40px 32px;
    }
    
    /* ===== Card Header ===== */
    .card-header { text-align: center; margin-bottom: 28px; }
    
    .card-icon {
      width: 56px; height: 56px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--brand-500), var(--brand-600), oklch(0.65 0.22 290));
      border-radius: calc(var(--radius) * 2);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgb(59 130 246 / 0.3);
    }
    .card-icon svg { color: white; }
    
    .card-title {
      font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--brand-500), var(--brand-600), oklch(0.65 0.22 290));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    
    .card-subtitle { font-size: 0.875rem; color: var(--muted-foreground); margin-top: 4px; }
    
    /* ===== Form ===== */
    .form { display: flex; flex-direction: column; gap: 14px; }
    
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
    
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    
    .form-label {
      font-size: 0.8125rem; font-weight: 500; color: var(--foreground);
    }
    
    .input-wrapper { position: relative; }
    
    .input-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted-foreground); pointer-events: none;
    }
    
    .form-input {
      width: 100%; height: 38px; padding: 0 12px;
      font-size: 0.875rem; color: var(--foreground);
      background: var(--input); border: 1px solid var(--border);
      border-radius: calc(var(--radius));
      transition: all 0.2s;
      outline: none;
    }
    .form-input.has-icon { padding-left: 38px; }
    
    .form-input:focus {
      border-color: var(--brand-400);
      box-shadow: var(--shadow-brand-glow);
    }
    
    .form-input::placeholder { color: var(--muted-foreground); }
    
    .form-input.error {
      border-color: var(--destructive);
    }
    
    .error-text {
      font-size: 0.75rem; color: var(--destructive);
      margin-top: 2px;
    }
    
    /* ===== Captcha ===== */
    .captcha-wrapper { display: flex; gap: 8px; }
    .captcha-wrapper .form-input { flex: 1; }
    .captcha-btn {
      width: 38px; height: 38px; flex-shrink: 0;
      background: var(--muted); border: 1px solid var(--border);
      border-radius: calc(var(--radius)); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted-foreground);
      transition: all 0.2s;
    }
    .captcha-btn:hover { background: var(--brand-50); border-color: var(--brand-200); }
    
    /* ===== Button ===== */
    .btn-primary {
      width: 100%; height: 42px;
      font-size: 0.9375rem; font-weight: 500;
      background: var(--brand-500); color: white;
      border: none; border-radius: calc(var(--radius));
      cursor: pointer;
      box-shadow: 0 1px 2px rgb(59 130 246 / 0.3);
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover { background: var(--brand-600); }
    .btn-primary:active { transform: scale(0.98); }
    
    /* ===== Links ===== */
    .form-footer {
      margin-top: 8px;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted-foreground);
    }
    .form-footer a { color: var(--brand-600); text-decoration: none; font-weight: 500; }
    .form-footer a:hover { text-decoration: underline; }
    
    /* ===== Terms ===== */
    .terms {
      font-size: 0.75rem; color: var(--muted-foreground);
      text-align: center; line-height: 1.5;
    }
    .terms a { color: var(--brand-600); text-decoration: none; }
    .terms a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Decorative Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Register Card -->
  <div class="register-card">
    <div class="card-header">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" x2="19" y1="8" y2="14"/>
          <line x1="22" x2="16" y1="11" y2="11"/>
        </svg>
      </div>
      <h1 class="card-title">创建新账户</h1>
      <p class="card-subtitle">加入我们，开始您的博客之旅</p>
    </div>

    <form class="form" action="/register" method="POST">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="username">用户名</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input class="form-input has-icon" type="text" id="username" name="username" placeholder="username" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="nickname">昵称</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/>
              <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
              <path d="M12 2v2"/>
              <path d="M12 20v2"/>
              <path d="m4.93 4.93 1.41 1.41"/>
              <path d="m17.66 17.66 1.41 1.41"/>
              <path d="M2 12h2"/>
              <path d="M20 12h2"/>
              <path d="m6.34 17.66-1.41 1.41"/>
              <path d="m19.07 4.93-1.41 1.41"/>
            </svg>
            <input class="form-input has-icon" type="text" id="nickname" name="nickname" placeholder="昵称">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">邮箱</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input class="form-input has-icon" type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input class="form-input has-icon" type="password" id="password" name="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm">确认密码</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input class="form-input has-icon" type="password" id="confirm" name="confirm" placeholder="••••••••" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="captcha">验证码</label>
        <div class="captcha-wrapper">
          <input class="form-input" type="text" id="captcha" name="captcha" placeholder="请输入验证码" required>
          <button type="button" class="captcha-btn" aria-label="刷新验证码">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
              <path d="M8 16H3v5"/>
            </svg>
          </button>
        </div>
      </div>

      <p class="terms">
        注册即表示同意 <a href="/terms">服务条款</a> 和 <a href="/privacy">隐私政策</a>
      </p>

      <button type="submit" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" x2="19" y1="8" y2="14"/>
          <line x1="22" x2="16" y1="11" y2="11"/>
        </svg>
        注册
      </button>
    </form>

    <div class="form-footer">
      已有账户？<a href="/login">立即登录</a>
    </div>
  </div>
</body>
</html>
