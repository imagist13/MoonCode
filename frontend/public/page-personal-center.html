<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - Dim Stack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS Reset & Base ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      /* Dark Mode Colors (OKLCH) */
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.95 0 0);
      --card: oklch(0.205 0 0);
      --card-foreground: oklch(0.95 0 0);
      --muted: oklch(0.18 0 0);
      --muted-foreground: oklch(0.65 0 0);
      --border: rgb(255 255 255 / 0.1);
      --input: oklch(0.18 0 0);
      --ring: oklch(0.556 0 0);
      --destructive: oklch(0.577 0.245 27.325);
      --success: oklch(0.72 0.19 145);
      
      /* Brand Colors */
      --brand-50: oklch(0.97 0.014 250);
      --brand-100: oklch(0.93 0.030 250);
      --brand-200: oklch(0.87 0.060 250);
      --brand-300: oklch(0.78 0.115 250);
      --brand-400: oklch(0.70 0.160 250);
      --brand-500: oklch(0.72 0.185 250);
      --brand-600: oklch(0.65 0.200 250);
      --brand-700: oklch(0.58 0.180 250);
      
      /* Radius */
      --radius: 0.625rem;
      
      /* Shadows */
      --shadow-card: 0 1px 3px 0 rgb(0 0 0 / 0.3);
      --shadow-card-hover: 0 10px 25px -3px rgb(0 0 0 / 0.4);
      --shadow-brand-glow: 0 0 0 3px rgb(59 130 246 / .18);
    }
    
    html { font-family: "Geist", ui-sans-serif, system-ui, sans-serif; }
    body { 
      background: var(--background); color: var(--foreground);
      -webkit-font-smoothing: antialiased;
      display: flex; min-height: 100vh;
    }
    
    /* ===== Sidebar (Same as Dashboard) ===== */
    .sidebar {
      width: 256px; height: 100vh; position: fixed; left: 0; top: 0;
      background: var(--card); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    
    .sidebar-header {
      padding: 20px 16px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    
    .sidebar-logo {
      width: 36px; height: 36px; border-radius: calc(var(--radius) * 1.4);
      background: linear-gradient(135deg, var(--brand-500), var(--brand-600), oklch(0.55 0.22 290));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgb(59 130 246 / 0.3);
    }
    .sidebar-logo svg { color: white; }
    
    .sidebar-brand { display: flex; flex-direction: column; }
    .sidebar-brand-title { font-size: 0.9375rem; font-weight: 600; }
    .sidebar-brand-sub { font-size: 0.6875rem; color: var(--muted-foreground); }
    
    .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
    
    .nav-group { margin-bottom: 16px; }
    
    .nav-group-label {
      font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--muted-foreground);
      padding: 8px 12px 4px;
    }
    
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: calc(var(--radius) * 0.8);
      color: var(--muted-foreground); text-decoration: none;
      font-size: 0.875rem; font-weight: 500;
      transition: all 0.15s;
    }
    .nav-item:hover { background: var(--muted); color: var(--foreground); }
    .nav-item.active { background: var(--brand-500 / 0.15); color: var(--brand-400); }
    .nav-item svg { flex-shrink: 0; }
    
    .nav-divider { height: 1px; background: var(--border); margin: 8px 12px; }
    
    .sidebar-footer {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--brand-400), var(--brand-600));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 600; color: white;
    }
    
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 0.8125rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-email { font-size: 0.6875rem; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* ===== Main Content ===== */
    .main {
      flex: 1; margin-left: 256px; display: flex; flex-direction: column;
    }
    
    /* ===== Top Header ===== */
    .main-header {
      height: 56px; border-bottom: 1px solid var(--border);
      padding: 0 24px; display: flex; align-items: center; gap: 12px;
      background: var(--background); position: sticky; top: 0; z-index: 10;
    }
    
    .header-trigger {
      width: 36px; height: 36px; border: none; background: transparent;
      border-radius: calc(var(--radius) * 0.8); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted-foreground);
      transition: all 0.15s;
    }
    .header-trigger:hover { background: var(--muted); color: var(--foreground); }
    
    .header-divider { width: 1px; height: 20px; background: var(--border); }
    
    .breadcrumbs { display: flex; align-items: center; gap: 4px; font-size: 0.875rem; }
    .breadcrumb-item { color: var(--muted-foreground); text-decoration: none; }
    .breadcrumb-item:hover { color: var(--foreground); }
    .breadcrumb-item.current { color: var(--foreground); font-weight: 500; }
    .breadcrumb-sep { color: var(--muted-foreground); }
    
    /* ===== Content ===== */
    .content { padding: 24px; display: flex; flex-direction: column; gap: 24px; }
    
    .page-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    
    /* ===== Profile Card ===== */
    .profile-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 1.6);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    
    .profile-header {
      padding: 24px; display: flex; gap: 20px;
      border-bottom: 1px solid var(--border);
    }
    
    .profile-avatar-wrap { position: relative; }
    
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, var(--brand-400), var(--brand-600));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem; font-weight: 700; color: white;
    }
    
    .avatar-edit-btn {
      position: absolute; bottom: 0; right: 0;
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--muted); border: 2px solid var(--card);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--muted-foreground);
      transition: all 0.15s;
    }
    .avatar-edit-btn:hover { background: var(--brand-500); color: white; border-color: var(--brand-500); }
    
    .profile-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .profile-name { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; }
    .profile-bio { font-size: 0.875rem; color: var(--muted-foreground); }
    
    /* ===== Form ===== */
    .profile-form { padding: 24px; }
    
    .form-section { margin-bottom: 24px; }
    .form-section:last-child { margin-bottom: 0; }
    
    .form-section-title {
      font-size: 0.9375rem; font-weight: 600; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .form-section-title::before {
      content: ''; width: 3px; height: 16px;
      background: var(--brand-500); border-radius: 2px;
    }
    
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full-width { grid-column: 1 / -1; }
    
    .form-label { font-size: 0.8125rem; font-weight: 500; color: var(--muted-foreground); }
    
    .form-input {
      width: 100%; height: 40px; padding: 0 12px;
      font-size: 0.875rem; color: var(--foreground);
      background: var(--input); border: 1px solid var(--border);
      border-radius: calc(var(--radius));
      transition: all 0.2s;
      outline: none;
      font-family: inherit;
    }
    .form-input:focus {
      border-color: var(--brand-400);
      box-shadow: var(--shadow-brand-glow);
    }
    .form-input::placeholder { color: var(--muted-foreground); }
    
    .form-select {
      width: 100%; height: 40px; padding: 0 12px;
      font-size: 0.875rem; color: var(--foreground);
      background: var(--input); border: 1px solid var(--border);
      border-radius: calc(var(--radius));
      transition: all 0.2s;
      outline: none;
      cursor: pointer;
    }
    .form-select:focus {
      border-color: var(--brand-400);
      box-shadow: var(--shadow-brand-glow);
    }
    
    .form-textarea {
      width: 100%; min-height: 100px; padding: 12px;
      font-size: 0.875rem; color: var(--foreground);
      background: var(--input); border: 1px solid var(--border);
      border-radius: calc(var(--radius));
      transition: all 0.2s;
      outline: none;
      resize: vertical;
      font-family: inherit;
    }
    .form-textarea:focus {
      border-color: var(--brand-400);
      box-shadow: var(--shadow-brand-glow);
    }
    
    /* ===== Buttons ===== */
    .form-actions {
      display: flex; gap: 12px; justify-content: flex-end;
      padding-top: 16px; border-top: 1px solid var(--border);
      margin-top: 24px;
    }
    
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; font-size: 0.875rem; font-weight: 500;
      border-radius: calc(var(--radius)); cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    
    .btn-primary {
      background: var(--brand-500); color: white;
      box-shadow: 0 1px 2px rgb(59 130 246 / 0.3);
    }
    .btn-primary:hover { background: var(--brand-600); }
    
    .btn-outline {
      background: transparent; color: var(--foreground);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { background: var(--muted); }
    
    /* ===== API Key Section ===== */
    .api-key-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 1.4);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    
    .api-key-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .api-key-title { font-size: 0.9375rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    
    .api-key-badge {
      font-size: 0.625rem; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; padding: 2px 6px;
      background: var(--brand-500 / 0.15); color: var(--brand-400);
      border-radius: calc(var(--radius) * 0.4);
    }
    
    .api-key-body { padding: 20px; }
    
    .api-key-info {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 16px; background: var(--muted);
      border-radius: calc(var(--radius)); margin-bottom: 16px;
    }
    .api-key-icon {
      width: 36px; height: 36px; border-radius: calc(var(--radius) * 0.6);
      background: var(--brand-500 / 0.15); color: var(--brand-400);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .api-key-text { flex: 1; }
    .api-key-desc { font-size: 0.8125rem; color: var(--muted-foreground); line-height: 1.5; }
    
    .api-key-display {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px; background: var(--input);
      border: 1px solid var(--border); border-radius: calc(var(--radius));
      font-family: "Geist Mono", monospace;
    }
    .api-key-value {
      flex: 1; font-size: 0.8125rem; color: var(--foreground);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .api-key-value.masked { color: var(--muted-foreground); }
    
    .api-key-actions { display: flex; gap: 8px; }
    
    .icon-btn {
      width: 32px; height: 32px; border: none; background: transparent;
      border-radius: calc(var(--radius) * 0.6); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted-foreground);
      transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--muted); color: var(--foreground); }
    .icon-btn.danger:hover { background: var(--destructive / 0.15); color: var(--destructive); }
    
    .api-key-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 16px; border-top: 1px solid var(--border); margin-top: 16px;
    }
    .api-key-date { font-size: 0.75rem; color: var(--muted-foreground); }
    
    .btn-sm {
      padding: 6px 12px; font-size: 0.75rem;
    }
    .btn-danger {
      background: var(--destructive); color: white;
    }
    .btn-danger:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <div class="sidebar-brand">
        <span class="sidebar-brand-title">Dim Stack</span>

    <nav class="sidebar-nav">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        </a>
      </div>

      <div class="nav-divider"></div>

      <div class="nav-group">
        <div class="nav-group-label">系统</div>
        <a href="/admin/settings" class="nav-item">

            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>

    <div class="sidebar-footer">

      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <header class="main-header">
      <button class="header-trigger" aria-label="切换侧边栏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </button>
      <div class="header-divider"></div>
      <nav class="breadcrumbs">
        <a href="/admin" class="breadcrumb-item">首页</a>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-item current">个人中心</span>
      </nav>
    </header>

    <div class="content">
      <h1 class="page-title">个人中心</h1>

      <!-- Profile Card -->
      <div class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar-wrap">
            <div class="profile-avatar">Z</div>
            <button class="avatar-edit-btn" aria-label="修改头像">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
              </svg>
            </button>
          </div>
          <div class="profile-info">
            <div class="profile-name">赵雷</div>
            <div class="profile-bio">全栈开发者 | 技术博主 | 开源贡献者</div>
          </div>
        </div>

        <form class="profile-form">
          <div class="form-section">
            <h3 class="form-section-title">基本信息</h3>
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input class="form-input" type="text" id="username" name="username" value="zhaolei" readonly>
              </div>
              <div class="form-group">
                <label class="form-label" for="nickname">昵称</label>
                <input class="form-input" type="text" id="nickname" name="nickname" value="赵雷">
              </div>
              <div class="form-group">
                <label class="form-label" for="email">邮箱</label>
                <input class="form-input" type="email" id="email" name="email" value="admin@example.com">
              </div>
              <div class="form-group">
                <label class="form-label" for="phone">手机号</label>
                <input class="form-input" type="tel" id="phone" name="phone" placeholder="请输入手机号">
              </div>
              <div class="form-group">
                <label class="form-label" for="birthday">生日</label>
                <input class="form-input" type="date" id="birthday" name="birthday">
              </div>
              <div class="form-group">
                <label class="form-label" for="gender">性别</label>
                <select class="form-select" id="gender" name="gender">
                  <option value="">请选择</option>
                  <option value="male">男</option>
                  <option value="female">女</option>
                  <option value="secret">保密</option>
                </select>
              </div>
              <div class="form-group full-width">
                <label class="form-label" for="bio">个人简介</label>
                <textarea class="form-textarea" id="bio" name="bio" placeholder="介绍一下自己...">全栈开发者 | 技术博主 | 开源贡献者</textarea>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3 class="form-section-title">修改密码</h3>
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label" for="current-password">当前密码</label>
                <input class="form-input" type="password" id="current-password" name="current_password" placeholder="请输入当前密码">
              </div>
              <div class="form-group">
                <label class="form-label" for="new-password">新密码</label>
                <input class="form-input" type="password" id="new-password" name="new_password" placeholder="请输入新密码">
              </div>
              <div class="form-group">
                <label class="form-label" for="confirm-password">确认新密码</label>
                <input class="form-input" type="password" id="confirm-password" name="confirm_password" placeholder="请再次输入新密码">
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-outline">取消</button>
            <button type="submit" class="btn btn-primary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
              保存更改
            </button>
          </div>
        </form>
      </div>

      <!-- API Key Section -->
      <div class="api-key-card">
        <div class="api-key-header">
          <div class="api-key-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/>
            </svg>
            API Key 管理
            <span class="api-key-badge">Beta</span>
          </div>
          <button class="btn btn-sm btn-primary">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/>
            </svg>
            创建新 Key
          </button>
        </div>
        <div class="api-key-body">
          <div class="api-key-info">
            <div class="api-key-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/>
              </svg>
            </div>
            <div class="api-key-text">
              <div class="api-key-desc">
                API Key 用于通过编程方式访问您的博客数据。请妥善保管，不要泄露给他人。
              </div>
            </div>
          </div>

          <div class="api-key-display">
            <span class="api-key-value masked">••••••••••••••••••••••••••••••••</span>
            <div class="api-key-actions">
              <button class="icon-btn" aria-label="显示密钥">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
              <button class="icon-btn" aria-label="复制密钥">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="api-key-footer">
            <span class="api-key-date">创建于 2026-06-15</span>
            <button class="btn btn-sm btn-danger">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              </svg>
              删除
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
