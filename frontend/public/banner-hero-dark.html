<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 Hero Banner - 深色模式</title>
  <style>
    /* ===== 深色模式设计 Tokens ===== */
    :root {
      /* 品牌蓝 - 深色模式增强 */
      --brand-50: oklch(0.27  0.040 250);
      --brand-100: oklch(0.30  0.060 250);
      --brand-200: oklch(0.35  0.090 250);
      --brand-300: oklch(0.45  0.130 250);
      --brand-400: oklch(0.65  0.180 250);
      --brand-500: oklch(0.72  0.185 250);
      --brand-600: oklch(0.78  0.160 250);
      --brand-700: oklch(0.85  0.130 250);
      --brand-800: oklch(0.90  0.090 250);
      --brand-900: oklch(0.95  0.050 250);
      
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== Hero Banner Styles - 深色模式 ===== */
    .hero-banner {
      position: relative;
      width: 100%;
      min-height: 500px;
      max-height: 600px;
      overflow: hidden;
      background: linear-gradient(135deg, #0a0a0f 0%, oklch(0.18 0.02 250) 50%, oklch(0.22 0.03 265) 100%);
    }

    /* 背景光晕效果 */
    .hero-bg-effects {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .hero-bg-effects::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(ellipse at 20% 30%, oklch(0.72 0.185 250 / 0.5) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, oklch(0.65 0.180 250 / 0.35) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 50%, oklch(0.55 0.200 258 / 0.2) 0%, transparent 55%);
      animation: bgPulse 10s ease-in-out infinite;
    }

    .hero-bg-effects::after {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 30% 100%, oklch(0.12 0 0 / 0.8) 0%, transparent 50%),
        linear-gradient(180deg, oklch(0.08 0 0 / 0.5) 0%, oklch(0 0 0 / 0.3) 100%);
    }

    @keyframes bgPulse {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.08) rotate(-3deg); opacity: 0.85; }
    }

    /* 网格背景 */
    .hero-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(oklch(1 0 0 / 0.02) 1px, transparent 1px),
        linear-gradient(90deg, oklch(1 0 0 / 0.02) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    }

    /* 浮动的装饰光点 */
    .floating-particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }

    .particle:nth-child(1) { 
      width: 6px; height: 6px; 
      left: 15%; top: 25%; 
      background: oklch(0.72 0.185 250 / 0.7);
      animation-delay: 0s; animation-duration: 7s; 
    }
    .particle:nth-child(2) { 
      width: 4px; height: 4px; 
      left: 30%; top: 70%; 
      background: oklch(0.65 0.180 250 / 0.5);
      animation-delay: 1s; animation-duration: 5s; 
    }
    .particle:nth-child(3) { 
      width: 8px; height: 8px; 
      left: 55%; top: 35%; 
      background: oklch(0.78 0.160 250 / 0.6);
      animation-delay: 2s; animation-duration: 9s; 
    }
    .particle:nth-child(4) { 
      width: 3px; height: 3px; 
      left: 75%; top: 55%; 
      background: oklch(0.72 0.185 250 / 0.8);
      animation-delay: 0.5s; animation-duration: 6s; 
    }
    .particle:nth-child(5) { 
      width: 5px; height: 5px; 
      left: 85%; top: 20%; 
      background: oklch(0.55 0.200 258 / 0.6);
      animation-delay: 1.5s; animation-duration: 8s; 
    }
    .particle:nth-child(6) { 
      width: 4px; height: 4px; 
      left: 5%; top: 60%; 
      background: oklch(0.65 0.180 250 / 0.5);
      animation-delay: 3s; animation-duration: 7s; 
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-40px) scale(1.3); opacity: 1; }
    }

    /* 内容区域 */
    .hero-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 500px;
      max-height: 600px;
      padding: 3rem 2rem;
    }

    @media (min-width: 640px) {
      .hero-content {
        padding: 4rem 3rem;
      }
    }

    /* 玻璃面板 - 深色模式 */
    .glass-panel {
      background: oklch(0.15 0.015 250 / 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid oklch(1 0 0 / 0.1);
      border-radius: 1.5rem;
      padding: 2rem 2.5rem;
      max-width: 680px;
      box-shadow: 
        0 25px 50px -12px oklch(0 0 0 / 0.5),
        0 0 80px oklch(0.72 0.185 250 / 0.1),
        inset 0 1px 0 oklch(1 0 0 / 0.1);
    }

    @media (min-width: 640px) {
      .glass-panel {
        padding: 2.5rem 3rem;
      }
    }

    /* 标签徽章 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.875rem;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 9999px;
      background: oklch(0.72 0.185 250 / 0.2);
      border: 1px solid oklch(0.72 0.185 250 / 0.3);
      color: oklch(0.72 0.185 250);
      backdrop-filter: blur(10px);
    }

    .badge-brand {
      background: oklch(0.72 0.185 250 / 0.3);
      border-color: oklch(0.72 0.185 250 / 0.5);
      color: oklch(1 0 0);
    }

    /* 标题样式 */
    .hero-title {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-top: 1.5rem;
      color: oklch(0.985 0 0);
    }

    @media (min-width: 640px) {
      .hero-title {
        font-size: 2.75rem;
      }
    }

    @media (min-width: 768px) {
      .hero-title {
        font-size: 3.25rem;
      }
    }

    .title-accent {
      display: block;
      background: linear-gradient(135deg, oklch(0.72 0.185 250) 0%, oklch(0.78 0.160 250) 50%, oklch(0.85 0.130 250) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 20px oklch(0.72 0.185 250 / 0.4));
    }

    /* 副标题 */
    .hero-subtitle {
      margin-top: 1rem;
      font-size: 1rem;
      line-height: 1.6;
      color: oklch(0.708 0 0);
    }

    @media (min-width: 640px) {
      .hero-subtitle {
        font-size: 1.0625rem;
      }
    }

    /* CTA 按钮 */
    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      padding: 0.875rem 1.75rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: oklch(0.145 0 0);
      background: linear-gradient(135deg, oklch(0.72 0.185 250) 0%, oklch(0.65 0.180 250) 100%);
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 
        0 4px 20px oklch(0.72 0.185 250 / 0.4),
        inset 0 1px 0 oklch(1 0 0 / 0.2);
    }

    .hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 8px 30px oklch(0.72 0.185 250 / 0.5),
        inset 0 1px 0 oklch(1 0 0 / 0.2);
    }

    .hero-cta svg {
      transition: transform 0.3s ease;
    }

    .hero-cta:hover svg {
      transform: translateX(4px);
    }

    /* 顶部装饰线 */
    .top-shine {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, oklch(0.72 0.185 250 / 0.8) 30%, oklch(0.72 0.185 250 / 0.3) 70%, transparent 100%);
    }

    /* 底部渐变 */
    .bottom-fade {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 120px;
      background: linear-gradient(to top, oklch(0.145 0 0 / 0.8) 0%, transparent 100%);
    }
  </style>
</head>
<body>
  <!-- Hero Banner - 深色模式 -->
  <section class="hero-banner">
    <!-- 背景效果 -->
    <div class="hero-bg-effects"></div>
    <div class="hero-grid"></div>
    <div class="floating-particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    <div class="top-shine"></div>
    <div class="bottom-fade"></div>

    <!-- 内容 -->
    <div class="hero-content">
      <div class="glass-panel">
        <!-- 标签 -->
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
          <span class="badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l1.912 5.813a2 2 0 001.272 1.272L21 12l-5.813 1.912a2 2 0 00-1.272 1.272L12 21l-1.912-5.813a2 2 0 00-1.272-1.272L3 12l5.813-1.912a2 2 0 001.272-1.272L12 3z"/>
            </svg>
            Welcome
          </span>
          <span class="badge badge-brand">技术博客</span>
        </div>

        <!-- 标题 -->
        <h1 class="hero-title">
          欢迎来到
          <span class="title-accent">我的技术空间</span>
        </h1>

        <!-- 副标题 -->
        <p class="hero-subtitle">
          记录技术成长，分享实战经验。<br>
          保持好奇，持续输出。
        </p>

        <!-- CTA -->
        <a href="#articles" class="hero-cta">
          开始阅读
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </div>
  </section>
</body>
</html>
