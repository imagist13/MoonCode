    <nav class="admin-nav">
      <a href="./admin.html" class="admin-nav-link active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>

      <a href="./admin-new.html" class="admin-nav-link">

      <a href="./admin-account.html" class="admin-nav-link">

    <div class="admin-user">

      <div class="admin-user-info">
        <div class="admin-user-name">Moon</div>
        <div class="admin-user-role">Administrator</div>
      </div>
      <a href="./index.html" class="admin-user-out" title="返回博客">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 class="admin-h1">仪表盘</h1>
      <a href="./admin-new.html" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        写文章
      </a>
    </header>

    <!-- Stats -->
    <section class="admin-stats">
      <div class="stat-card">
        <div class="stat-label">已发布</div>
        <div class="stat-num">32</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">草稿</div>
        <div class="stat-num">5</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">总浏览</div>
        <div class="stat-num">12.4k</div>
      </div>
    </section>

    <!-- Articles Table -->
    <section class="admin-section">
      <div class="admin-section-head">
        <h2>全部文章</h2>
        <div class="admin-filter">
          <button class="active">全部</button>
          <button>已发布</button>
          <button>草稿</button>
        </div>
      </div>
      <div class="admin-table">
        <div class="admin-table-head">
          <div>标题</div>
          <div>状态</div>
          <div>更新时间</div>
          <div></div>

        <div class="admin-table-row">
          <div class="td-title">用 DDD 构建可维护的 Go 后端</div>
          <div><span class="status pub">已发布</span></div>
          <div class="td-time">2026-07-25</div>
          <div class="td-actions">
            <a href="./admin-new.html">编辑</a>
            <a href="./article.html">预览</a>
          </div>
        </div>
        <div class="admin-table-row">
          <div class="td-title">Next.js 16 App Router 深度实践</div>
          <div><span class="status pub">已发布</span></div>
          <div class="td-time">2026-07-20</div>

            <a href="./admin-new.html">编辑</a>
            <a href="./article.html">预览</a>
          </div>
        </div>
        <div class="admin-table-row">
          <div class="td-title">React 19 use 与 Suspense 的深水区</div>
          <div><span class="status draft">草稿</span></div>
          <div class="td-time">2026-07-18</div>
          <div class="td-actions">
            <a href="./admin-new.html">编辑</a>
            <a href="#">删除</a>
          </div>
        </div>
        <div class="admin-table-row">
          <div class="td-title">用 Redis 做 JWT 黑名单</div>
          <div><span class="status pub">已发布</span></div>
          <div class="td-time">2026-07-15</div>
          <div class="td-actions">
            <a href="./admin-new.html">编辑</a>
            <a href="./article.html">预览</a>
          </div>
        </div>
        <div class="admin-table-row">
          <div class="td-title">一个后端工程师的审美修炼</div>
          <div><span class="status pub">已发布</span></div>
          <div class="td-time">2026-07-08</div>
          <div class="td-actions">
            <a href="./admin-new.html">编辑</a>
            <a href="./article.html">预览</a>
          </div>
        </div>
      </div>
    </section>

  <script src="./assets/app.js"></script>
