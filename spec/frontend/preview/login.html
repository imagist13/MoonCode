<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · MoonBlog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.waves.min.js"></script>
</head>
<body>

  <main style="min-height:100vh; display:grid; grid-template-columns: 1fr;" class="auth-grid">
    <!-- Left: Canvas hero -->
    <aside style="position:relative; display:none; overflow:hidden; background: linear-gradient(135deg, var(--brand-violet), var(--brand-blue));" class="auth-canvas-side">
      <div class="canvas-bg" data-vanta="waves"></div>
      <div style="position:relative; z-index:1; padding: 4rem 3rem; display:flex; flex-direction:column; justify-content:space-between; height:100%; color:#fff;">
        <a href="./index.html" style="display:inline-flex; align-items:center; gap:.75rem; color:#fff; text-decoration:none;">
          <span style="width:32px; height:32px; border-radius:9999px; background:#fff;"></span>
          <span class="font-serif" style="font-size:1.5rem;">MoonBlog</span>
        </a>
        <div>
          <div class="serif-italic" style="font-size:3.5rem; line-height:1.1; margin-bottom:1.5rem; letter-spacing:-.02em;">
            Welcome<br />back.
          </div>
          <p style="max-width:24rem; line-height:1.7; font-weight:300; color:rgba(255,255,255,.85);">
            登录后即可管理你的文章、订阅偏好与主题设置。
          </p>
        </div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.15em; color:rgba(255,255,255,.6);">
          v0.1 · Design Preview
        </div>
      </div>
    </aside>

    <!-- Right: Form -->
    <section style="display:flex; align-items:center; justify-content:center; padding: 6rem 1.5rem;">
      <div style="width:100%; max-width:26rem;" class="reveal">
        <div style="margin-bottom:3rem;">
          <a href="./index.html" class="nav-pill" style="margin-bottom:2rem;">← 返回首页</a>
          <h1 style="font-size:2.5rem; margin: 2rem 0 .75rem; font-weight:500; letter-spacing:-.02em;">登录 <span class="serif-italic">MoonBlog.</span></h1>
          <p style="color:var(--text-muted); font-size:.95rem; margin:0;">还没有账户？ <a href="./register.html" style="color:var(--brand-violet); font-weight:500; text-decoration:none;">立即注册 →</a></p>
        </div>

        <form style="display:flex; flex-direction:column; gap:1.25rem;">
          <div>
            <label class="field-label">邮箱 / 用户名</label>
            <input type="text" class="field" placeholder="you@example.com" />
          </div>
          <div>
            <label class="field-label">密码</label>
            <input type="password" class="field" placeholder="••••••••" />
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px;">
            <label style="display:inline-flex; align-items:center; gap:.5rem; color:var(--text-muted); cursor:pointer;">
              <input type="checkbox" />
              记住我
            </label>
            <a href="#" style="color:var(--brand-violet); text-decoration:none;">忘记密码？</a>
          </div>
          <button type="button" class="btn-primary magnetic" style="justify-content:center; margin-top:.5rem;">
            登录
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </form>

        <div style="display:flex; align-items:center; gap:1rem; margin: 2.5rem 0 1.5rem; color:var(--text-soft); font-size:12px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.15em;">
          <span style="flex:1; height:1px; background:var(--border);"></span>
          <span>或</span>
          <span style="flex:1; height:1px; background:var(--border);"></span>
        </div>

        <div style="display:flex; flex-direction:column; gap:.75rem;">
          <button type="button" class="btn-secondary" style="justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.55v-2.02c-3.2.69-3.87-1.35-3.87-1.35-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.73 1.27 3.4.97.1-.75.4-1.27.74-1.56-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.77.11 3.06.74.8 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.66.79.55A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
            使用 GitHub 登录
          </button>
          <button type="button" class="btn-secondary" style="justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.2c0-.8-.1-1.7-.2-2.5H12v4.7h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.3c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2V6.8H1.4C.5 8.4 0 10.1 0 12s.5 3.6 1.4 5.2l4-3z"/><path fill="#EA4335" d="M12 4.7c1.7 0 3.3.6 4.5 1.7l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.8l4 3.1c1-2.7 3.5-4.9 6.6-4.9z"/></svg>
            使用 Google 登录
          </button>
        </div>

        <p style="text-align:center; margin-top:2.5rem; font-size:12px; color:var(--text-soft);">
          登录即代表你同意 <a href="#" style="color:var(--text-muted);">服务条款</a> 与 <a href="#" style="color:var(--text-muted);">隐私政策</a>。
        </p>
      </div>
    </section>
  </main>

  <style>
    @media (min-width: 1024px) {
      .auth-grid { grid-template-columns: 1.1fr 1fr !important; }
      .auth-canvas-side { display:block !important; }
    }
  </style>

  <script src="./assets/app.js"></script>
</body>
</html>
