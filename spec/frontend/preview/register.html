<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 · MoonBlog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.waves.min.js"></script>
</head>
<body>

  <main style="min-height:100vh; display:grid; grid-template-columns:1fr;" class="auth-grid">
    <section style="display:flex; align-items:center; justify-content:center; padding: 6rem 1.5rem; order:2;" class="auth-form-side">
      <div style="width:100%; max-width:26rem;" class="reveal">
        <div style="margin-bottom:3rem;">
          <a href="./index.html" class="nav-pill" style="margin-bottom:2rem;">← 返回首页</a>
          <h1 style="font-size:2.5rem; margin:2rem 0 .75rem; font-weight:500; letter-spacing:-.02em;">创建 <span class="serif-italic">账户.</span></h1>
          <p style="color:var(--text-muted); font-size:.95rem; margin:0;">已经有账户？ <a href="./login.html" style="color:var(--brand-violet); font-weight:500; text-decoration:none;">立即登录 →</a></p>
        </div>

        <form style="display:flex; flex-direction:column; gap:1.25rem;">
          <div>
            <label class="field-label">昵称</label>
            <input type="text" class="field" placeholder="Moon" />
          </div>
          <div>
            <label class="field-label">邮箱</label>
            <input type="email" class="field" placeholder="you@example.com" />
          </div>
          <div>
            <label class="field-label">密码</label>
            <input type="password" class="field" placeholder="至少 8 位，含字母与数字" />
          </div>
          <label style="display:inline-flex; align-items:center; gap:.5rem; color:var(--text-muted); font-size:13px;">
            <input type="checkbox" />
            我已阅读并同意 <a href="#" style="color:var(--brand-violet); text-decoration:none;">服务条款</a>
          </label>
          <button type="button" class="btn-primary magnetic" style="justify-content:center; margin-top:.5rem;">
            注册账户
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </form>

        <div style="display:flex; align-items:center; gap:1rem; margin: 2.5rem 0 1.5rem; color:var(--text-soft); font-size:12px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.15em;">
          <span style="flex:1; height:1px; background:var(--border);"></span>
          <span>或使用</span>
          <span style="flex:1; height:1px; background:var(--border);"></span>
        </div>
        <div style="display:flex; gap:.75rem;">
          <button type="button" class="btn-secondary" style="flex:1; justify-content:center;">GitHub</button>
          <button type="button" class="btn-secondary" style="flex:1; justify-content:center;">Google</button>
        </div>
      </div>
    </section>

    <aside style="position:relative; display:none; overflow:hidden; background: linear-gradient(135deg, var(--brand-pink), var(--brand-violet)); order:1;" class="auth-canvas-side">
      <div class="canvas-bg" data-vanta="waves"></div>
      <div style="position:relative; z-index:1; padding: 4rem 3rem; display:flex; flex-direction:column; justify-content:space-between; height:100%; color:#fff;">
        <a href="./index.html" style="display:inline-flex; align-items:center; gap:.75rem; color:#fff; text-decoration:none;">
          <span style="width:32px; height:32px; border-radius:9999px; background:#fff;"></span>
          <span class="font-serif" style="font-size:1.5rem;">MoonBlog</span>
        </a>
        <div>
          <div class="serif-italic" style="font-size:3.5rem; line-height:1.1; margin-bottom:1.5rem; letter-spacing:-.02em;">Join<br />the club.</div>
          <p style="max-width:24rem; line-height:1.7; font-weight:300; color:rgba(255,255,255,.85);">
            创建账户后即可订阅更新、收藏文章、发表评论，参与到 MoonBlog 社区。
          </p>
        </div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.15em; color:rgba(255,255,255,.6);">
          v0.1 · Design Preview
        </div>
      </div>
    </aside>
  </main>

  <style>
    @media (min-width: 1024px) {
      .auth-grid { grid-template-columns: 1fr 1.1fr !important; }
      .auth-canvas-side { display:block !important; }
      .auth-form-side { order:1 !important; }
      .auth-canvas-side { order:2 !important; }
    }
  </style>

  <script src="./assets/app.js"></script>
</body>
</html>
