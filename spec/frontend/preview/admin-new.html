  <main class="admin-main">
    <header class="admin-header">
      <h1 class="admin-h1">写文章</h1>
      <div class="admin-header-actions">
        <button class="btn-secondary">保存草稿</button>
        <button class="btn-primary">发布</button>
      </div>
    </header>

    <div class="editor-layout">
      <div class="editor-main">
        <input type="text" class="input title-input" placeholder="标题" value="用 DDD 构建可维护的 Go 后端" />

        <textarea class="input" rows="2" placeholder="摘要（会显示在文章列表页）"></textarea>

        <textarea class="input editor-area" placeholder="用 Markdown 开始写作..." rows="20">## 一、分层与职责

每一层只关心自己该关心的事：Interface 处理 HTTP、Application 编排用例、Domain 表达业务规则、Infrastructure 对接外部世界。

```go
type Article struct {
    ID       uint
    Title    string
    Slug     string
    Content  string
    AuthorID uint
}
```

## 二、仓储接口

Domain 层只定义 `Repository` 接口，具体实现放在 Infrastructure 层。</textarea>

        <div class="editor-status">
          <span>Markdown · 128 字</span>
          <span>已自动保存 · 刚刚</span>
        </div>
      </div>

      <aside class="editor-side">
        <div class="side-block">
          <div class="side-title">分类</div>
          <select class="input">
            <option>后端</option>
            <option>前端</option>
            <option>工具</option>
            <option>随笔</option>
          </select>
        </div>

        <div class="side-block">
          <div class="side-title">标签</div>
          <div class="tag-input">
            <span class="ti-chip">Go <button>×</button></span>
            <span class="ti-chip">DDD <button>×</button></span>
            <input placeholder="回车添加..." />
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script src="./assets/app.js"></script>
