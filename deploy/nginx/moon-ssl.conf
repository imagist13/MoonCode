# HTTPS 配置（Let's Encrypt / 自签均可）

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ideast.top www.ideast.top;

    ssl_certificate     /etc/nginx/ssl/ideast.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ideast.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100m;

    access_log /var/log/nginx/moon.ssl.access.log;
    error_log  /var/log/nginx/moon.ssl.error.log warn;

    include /etc/nginx/snippets/moon-locations.conf;
}

# HTTP -> HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name ideast.top www.ideast.top;
    return 301 https://$host$request_uri;
}
