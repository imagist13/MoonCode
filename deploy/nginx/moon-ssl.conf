# HTTPS 配置（Let's Encrypt / 自签均可）
#
# 使用：
#   1. 先用 certbot --nginx -d ideast.top 拿到证书
#      （自动生成 server block，你只需把下面 block 合并进去）
#   2. 或者手动：
#      a. mkdir -p /etc/nginx/ssl/ideast.top
#      b. 拷 fullchain.pem / privkey.pem 到这里
#      c. 在主 moon.conf 的 server { listen 80 } 里加 return 301 https://$host$request_uri;
#   3. nginx -t && nginx -s reload

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ideast.top www.ideast.top;

    # ===== 证书路径（按实际调整） =====
    ssl_certificate     /etc/nginx/ssl/ideast.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ideast.top/privkey.pem;

    # ===== 推荐的 TLS 配置（2024+） =====
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS（一旦上线 HTTPS 就别降级）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100m;

    access_log /var/log/nginx/moon.ssl.access.log;
    error_log  /var/log/nginx/moon.ssl.error.log warn;

    # ===== 反代逻辑跟 moon.conf 一致；为减少配置分裂，
    #       实际部署推荐把 upstream / location 块做成 snippet 引用 =====
    include /etc/nginx/snippets/moon-upstreams.conf;
    include /etc/nginx/snippets/moon-locations.conf;
}

# HTTP → HTTPS 跳转（合并进主 moon.conf 也行，这里独立放方便调试）
server {
    listen 80;
    listen [::]:80;
    server_name ideast.top www.ideast.top;
    return 301 https://$host$request_uri;
}