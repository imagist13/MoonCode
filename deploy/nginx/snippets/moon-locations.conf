# moon-locations.conf
# location 块集合（HTTP / HTTPS 共用）

limit_req_zone $binary_remote_addr zone=moon_limit:10m rate=30r/s;

location = /healthz {
    access_log off;
    proxy_pass http://moon_backend/health;
}

location /api/ {
    limit_req zone=moon_limit burst=60 nodelay;
    proxy_pass http://moon_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /uploads/ {
    proxy_pass http://moon_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_valid 200 30d;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location / {
    limit_req zone=moon_limit burst=60 nodelay;
    proxy_pass http://moon_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /_next/static/ {
    proxy_pass http://moon_frontend;
    proxy_cache_valid 200 365d;
    expires 365d;
    add_header Cache-Control "public, immutable";
}

location ~ /\.(env|git) { deny all; return 404; }