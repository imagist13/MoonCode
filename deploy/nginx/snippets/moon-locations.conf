# moon-locations.conf
# location 块集合（include 必须在 server 块内）
#
# 上游用变量表示：配合 http 层的 resolver，容器重建后 nginx 会重新解析
# backend / frontend 的 IP，而不是沿用启动时的旧地址。

set $moon_backend  backend:8080;
set $moon_frontend frontend:3000;

# 容器自身健康检查专用：由 nginx 直接返回，不依赖后端。
# docker-compose 的 healthcheck 打的就是这个地址。
location = /nginx-health {
    access_log off;
    return 200 "ok\n";
}

# 给 LB / 外部监控用的端到端健康检查（nginx → backend）
location = /healthz {
    access_log off;
    proxy_pass http://$moon_backend/health;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    limit_req zone=moon_limit burst=60 nodelay;
    proxy_pass http://$moon_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /uploads/ {
    proxy_pass http://$moon_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_valid 200 30d;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location / {
    limit_req zone=moon_limit burst=60 nodelay;
    proxy_pass http://$moon_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /_next/static/ {
    proxy_pass http://$moon_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host      $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cache_valid 200 365d;
    expires 365d;
    add_header Cache-Control "public, immutable";
}

location ~ /\.(env|git) { deny all; return 404; }
