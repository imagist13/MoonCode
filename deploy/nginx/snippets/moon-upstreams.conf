# moon-upstreams.conf — 在 http 上下文 include（由 conf.d/moon.conf 引入）

# Docker 内置 DNS。后端/前端容器重建后 IP 会变化，nginx 的 upstream 块
# 只在启动时解析一次，会一直使用旧 IP 导致 502。因此这里改用 resolver +
# 变量形式的 proxy_pass（见 moon-locations.conf），让 nginx 定期重新解析。
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=moon_limit:10m rate=30r/s;
