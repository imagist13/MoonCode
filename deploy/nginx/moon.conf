# 反向代理到 moon 博客
#
# 使用：
#   1. 把本文件软链 / 复制到 /etc/nginx/conf.d/moon.conf
#      （Debian/Ubuntu 也可以放在 sites-enabled/，自行起软链）
#   2. 修改 server_name 为你的域名
#   3. nginx -t && nginx -s reload
#
# 本配置只负责 HTTP 反代 + 静态缓存 + 限流 + 日志。
# HTTPS 终止由 moon-ssl.conf 接管（先 HTTP→HTTPS 跳转，再换证书）。

upstream moon_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream moon_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# 上传文件较大（max 100MB），调大超时
server {
    listen 80;
    listen [::]:80;
    server_name moon.example.com www.moon.example.com;

    access_log /var/log/nginx/moon.access.log;
    error_log  /var/log/nginx/moon.error.log warn;

    # 客户端上传大小，跟后端 max_size_mb 对齐
    client_max_body_size 100m;

    # 安全头（可按需调整）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 简单限流：防刷
    limit_req_zone $binary_remote_addr zone=moon_limit:10m rate=30r/s;

    # ===== 健康检查（不走限流，给 LB 用） =====
    location = /healthz {
        access_log off;
        proxy_pass http://moon_backend/health;
    }

    # ===== 后端 API =====
    location /api/ {
        limit_req zone=moon_limit burst=60 nodelay;
        proxy_pass http://moon_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ===== 上传文件（直连后端） =====
    location /uploads/ {
        proxy_pass http://moon_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 缓存上传文件 30 天
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 前端 =====
    location / {
        limit_req zone=moon_limit burst=60 nodelay;
        proxy_pass http://moon_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ===== Next 静态资源（standalone build 后由 node server.js 处理，
    #       这里只兜底万一打到 nginx） =====
    location /_next/static/ {
        proxy_pass http://moon_frontend;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 隐藏 dotfiles / 敏感路径 =====
    location ~ /\.(env|git) { deny all; return 404; }
}