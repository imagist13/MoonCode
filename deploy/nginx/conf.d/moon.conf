# 反向代理到 moon 博客（HTTP 入口；HTTPS 由 moon-ssl.conf 接管）
#
# 本目录整体挂载到 /etc/nginx/conf.d，会覆盖镜像自带的 default.conf。
# 必须覆盖它：官方镜像的 default.conf 里是 `server_name localhost`，
# 容器内健康检查请求 localhost 时会命中那个欢迎页 server，
# 导致 /nginx-health、/healthz 返回 404，nginx 容器被判定为 unhealthy。
#
# 另外显式声明 default_server：这样用公网 IP、localhost 或未匹配的域名
# 访问时也都会落到本站，而不是镜像欢迎页。

# docker 内置 DNS、限流 zone（只声明一次）
include /etc/nginx/snippets/moon-upstreams.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ideast.top www.ideast.top;

    access_log /var/log/nginx/moon.access.log;
    error_log  /var/log/nginx/moon.error.log warn;

    client_max_body_size 100m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/moon-locations.conf;
}
