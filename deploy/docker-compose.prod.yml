# 生产环境 docker-compose
#
# 与根目录 docker-compose.yml 的差别：
#   1. nginx 作为唯一对外端口（80/443），不再直接暴露 3000/8080
#   2. 后端 mode 强制 release（不留 debug 接口）
#   3. 日志 json-file + size 轮转（避免磁盘被填满）
#   4. AUTO_MIGRATE_ON_STARTUP 默认 false，必须手动跑 ./migrate
#   5. 基础设施服务只跑 postgres / redis / rabbitmq / elasticsearch
#   6. volumes 命名化（postgres_data 等），方便备份迁移
#
# 应用镜像由 CI 构建后推送到 GHCR，本文件不再包含 build（服务器不构建）。
#
# 启动：
#   cp deploy/.env.production.example .env   # 编辑后填值
#   docker compose -f deploy/docker-compose.prod.yml pull
#   docker compose -f deploy/docker-compose.prod.yml up -d --wait postgres redis rabbitmq elasticsearch
#   docker compose -f deploy/docker-compose.prod.yml run --rm --no-deps backend /app/migrate
#   docker compose -f deploy/docker-compose.prod.yml run --rm --no-deps backend /app/seed
#   docker compose -f deploy/docker-compose.prod.yml up -d --wait backend frontend nginx
#   docker compose -f deploy/docker-compose.prod.yml run --rm --no-deps backend /app/reindex

services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: blog-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
      args:
        IK_VERSION: 7.17.24
    image: blog-elasticsearch:7.17.24-ik
    container_name: blog-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  backend:
    # 生产不在服务器上构建：CI 把带 commit sha 标签的镜像推到 GHCR，这里只拉取。
    # IMAGE_PREFIX / IMAGE_TAG 由 deploy workflow 注入（见 .env.production.example）。
    image: ${IMAGE_PREFIX:-ghcr.io/tajiaoyezi/moon}-backend:${IMAGE_TAG:-latest}
    container_name: blog-backend
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必填}
      - AUTO_MIGRATE_ON_STARTUP=${AUTO_MIGRATE_ON_STARTUP:-false}
      - TZ=Asia/Shanghai
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER 必填}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB 必填}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      # 默认 false：管理员已存在时 seed 不改密码，部署不会踢掉已登录用户
      - SEED_ADMIN_RESET_PASSWORD=${SEED_ADMIN_RESET_PASSWORD:-false}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:        { condition: service_healthy }
      redis:           { condition: service_healthy }
      rabbitmq:        { condition: service_healthy }
      elasticsearch:   { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 不暴露 8080，对外只走 nginx
    expose: ["8080"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    # NEXT_PUBLIC_API_BASE / BACKEND_URL 已在 CI 构建镜像时作为 build-arg 固化
    image: ${IMAGE_PREFIX:-ghcr.io/tajiaoyezi/moon}-frontend:${IMAGE_TAG:-latest}
    container_name: blog-frontend
    restart: always
    environment:
      - BACKEND_URL=http://backend:8080
      - TZ=Asia/Shanghai
    depends_on:
      backend: { condition: service_healthy }
    expose: ["3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  nginx:
    image: nginx:1.27-alpine
    container_name: blog-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 整个 conf.d 目录挂载，覆盖镜像自带的 default.conf。
      # 否则 localhost 会命中镜像欢迎页，容器健康检查 404 → unhealthy。
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/ssl:ro
      # certbot webroot：宿主机先 mkdir -p /var/www/certbot，续期时无需停 nginx
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:  { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      # 只检查 nginx 自身是否在正常响应，不依赖后端
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  es_data:
  backend_uploads: